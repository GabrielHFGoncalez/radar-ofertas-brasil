name: Autonomous Deals Radar Cron

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install httpx beautifulsoup4

      - name: Execute Scraper Engine
        run: |
          python tools/deals_radar_engine.py

      - name: Commit and Push Updated Deals
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_deals_feed.json
          if git diff --staged --quiet; then
            echo "No changes in deals feed."
          else
            git commit -m "chore(radar): automated deals update [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin main
          fi
